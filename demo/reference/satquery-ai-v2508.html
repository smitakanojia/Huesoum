<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SatQuery AI — Earth observation analysis in plain language</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SatQuery AI design system
   Light institutional palette. Colour is used for state and data;
   satellite imagery carries the visual colour of the product.
   ============================================================ */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#FFFFFF; --paper:#F6F5F2; --paper-2:#EDEBE6;
  --ink:#16212C; --ink-2:#4E5A66; --ink-3:#77828D;
  --rule:#DDE1E4; --rule-2:#C5CBD1;
  --navy:#17324D; --navy-2:#10263B; --blue:#214E6B; --blue-soft:#E8EFF4;
  --green:#356B5B; --green-soft:#E5EEE9; --sage:#78958A;
  --ochre:#B9843B; --ochre-soft:#F7EFE1;
  --warn:#9A6519; --warn-soft:#FBF2E3; --warn-line:#E5C891;
  --loss:#B85A45; --ok:#3F765C; --fail:#A4412E; --fail-soft:#F8EAE6;
  --font:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:4px; --r2:6px;
  --wrap:1240px; --gut:clamp(20px,4vw,40px);
  --hdr:60px;
}
/* The viewer may run in dark mode; this product is specified as a light,
   paper-white interface, so dark tokens intentionally stay light. */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#FFFFFF; } }
:root[data-theme="dark"]{ --bg:#FFFFFF; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 12px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ margin:0; }
body{ background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow-x:hidden; }
img,canvas,svg,video{ max-width:100%; display:block; }
a{ color:var(--blue); text-underline-offset:3px; }
button{ font:inherit; color:inherit; }
h1,h2,h3,h4{ margin:0; font-weight:600; letter-spacing:-.01em; line-height:1.2; color:var(--ink); }
p{ margin:0; }
.mono{ font-family:var(--mono); font-size:12px; letter-spacing:0; }
.muted{ color:var(--ink-2); } .faint{ color:var(--ink-3); }
.wrap{ max-width:var(--wrap); margin:0 auto; padding:0 var(--gut); }
.sr{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; border-radius:2px; }

/* ---------- Buttons ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:42px; padding:0 18px;
  border-radius:var(--r); border:1px solid transparent; font-weight:500; font-size:15px; cursor:pointer;
  text-decoration:none; white-space:nowrap; transition:background .15s,border-color .15s,color .15s; }
.btn-primary{ background:var(--navy); color:#fff; }
.btn-primary:hover{ background:var(--navy-2); }
.btn-primary[disabled]{ background:#9AA6B2; cursor:not-allowed; }
.btn-line{ background:#fff; border-color:var(--rule-2); color:var(--ink); }
.btn-line:hover{ border-color:var(--navy); color:var(--navy); }
.btn-quiet{ background:transparent; color:var(--blue); padding:0 6px; height:auto; }
.btn-quiet:hover{ text-decoration:underline; }
.btn-sm{ height:34px; padding:0 12px; font-size:14px; }
.icon-btn{ width:40px; height:40px; display:inline-grid; place-items:center; border:1px solid var(--rule-2);
  background:#fff; border-radius:var(--r); cursor:pointer; color:var(--ink); }
.icon-btn:hover:not([disabled]){ border-color:var(--navy); color:var(--navy); }
.icon-btn[disabled]{ opacity:.35; cursor:default; }

/* ---------- Logo ---------- */
.brand{ display:inline-flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); }
.brand-name{ font-size:18px; font-weight:600; letter-spacing:-.01em; }
.brand-name span{ font-weight:400; color:var(--ink-2); margin-left:4px; }

/* ---------- Header ---------- */
.hdr{ position:sticky; top:0; z-index:40; background:rgba(255,255,255,.97); border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top,0px); }
.hdr-in{ height:var(--hdr); display:flex; align-items:center; gap:28px; }
.hdr nav{ display:flex; gap:4px; margin-left:12px; }
.hdr nav a{ font-size:14.5px; color:var(--ink-2); text-decoration:none; padding:6px 10px; border-radius:var(--r); }
.hdr nav a:hover{ color:var(--ink); background:var(--paper); }
.hdr nav a[aria-current="page"]{ color:var(--navy); font-weight:600; box-shadow:inset 0 -2px 0 var(--navy); border-radius:0; }
.hdr-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.status-pill{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2); }
.status-dot{ width:7px; height:7px; border-radius:50%; background:var(--ochre); }
.status-dot.on{ background:var(--ok); }
.user-chip{ display:inline-flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-2); }
.avatar{ width:30px; height:30px; border-radius:50%; background:var(--blue-soft); color:var(--navy); display:grid; place-items:center; font-weight:600; font-size:13px; }
.menu-btn{ display:none; }

/* ---------- Splash / loading page ---------- */
#splash{ position:fixed; inset:0; z-index:100; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; transition:opacity .45s ease; }
#splash.gone{ opacity:0; pointer-events:none; }
.splash-mark .orbit-front{ stroke-dasharray:0 100; animation:orbitDraw 1.2s .15s ease forwards; }
.splash-mark .sat{ opacity:0; animation:fadeIn .4s 1.1s forwards; }
@keyframes orbitDraw{ to{ stroke-dasharray:50 100; } }
@keyframes fadeIn{ to{ opacity:1; } }
.splash-title{ text-align:center; }
.splash-title h1{ font-size:26px; font-weight:600; }
.splash-title p{ color:var(--ink-2); font-size:14.5px; margin-top:4px; }
.splash-bar{ width:220px; height:2px; background:var(--rule); position:relative; overflow:hidden; }
.splash-bar i{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--navy); transition:width .25s ease; }
.splash-step{ font-size:12.5px; color:var(--ink-3); min-height:18px; }

/* ---------- Page sections (home) ---------- */
.sec{ padding:clamp(64px,9vw,112px) 0; }
.sec-paper{ background:var(--paper); }
.sec-head{ max-width:760px; margin-bottom:44px; }
.sec-head h2{ font-size:clamp(28px,3.2vw,38px); font-weight:600; line-height:1.18; }
.sec-head p{ margin-top:14px; font-size:17px; color:var(--ink-2); max-width:640px; }
.kicker{ font-size:13px; font-weight:600; color:var(--green); margin-bottom:12px; display:block; }

.hero{ padding:clamp(40px,6vw,72px) 0 clamp(56px,7vw,88px); border-bottom:1px solid var(--rule); }
.hero-grid{ display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:clamp(32px,5vw,72px); align-items:center; }
.hero h1{ font-size:clamp(38px,4.6vw,62px); line-height:1.04; font-weight:600; letter-spacing:-.025em; }
.hero .tagline{ font-size:clamp(17px,1.5vw,20px); color:var(--ink-2); margin-top:22px; max-width:30em; line-height:1.55; }
.hero-actions{ display:flex; gap:12px; margin-top:34px; flex-wrap:wrap; }
.hero-meta{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-top:44px; padding-top:20px; border-top:1px solid var(--rule); flex-wrap:wrap; }
.hero-meta div{ font-size:13.5px; color:var(--ink-2); }
.hero-meta b{ display:block; color:var(--ink); font-weight:600; font-size:15px; }

.plate{ position:relative; margin:0; }
.plate-img{ position:relative; overflow:hidden; border-radius:2px; background:var(--paper-2); }
.plate-img canvas, .plate-img img{ width:100%; height:100%; object-fit:cover; }
.plate figcaption{ display:flex; justify-content:space-between; gap:16px; font-size:12px; color:var(--ink-3); padding-top:10px; }
.coord{ position:absolute; font-family:var(--mono); font-size:10.5px; color:rgba(255,255,255,.88); text-shadow:0 1px 2px rgba(0,0,0,.45); }
.qmark{ position:absolute; border:1.5px solid rgba(255,255,255,.95); }
.qmark::after{ content:attr(data-label); position:absolute; left:-1.5px; top:-24px; background:#fff; color:var(--navy); font-size:11.5px; font-weight:600; padding:2px 7px; white-space:nowrap; border-radius:2px; }

.motive-grid{ display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:clamp(32px,6vw,96px); }
.motive-lead{ font-size:clamp(24px,2.5vw,32px); line-height:1.3; font-weight:500; letter-spacing:-.015em; }
.problems{ display:grid; gap:0; }
.problem{ display:grid; grid-template-columns:180px minmax(0,1fr); gap:24px; padding:22px 0; border-top:1px solid var(--rule); }
.problem:last-child{ border-bottom:1px solid var(--rule); }
.problem h3{ font-size:16px; font-weight:600; }
.problem p{ color:var(--ink-2); font-size:15.5px; }

/* Demo storyboard */
.demo{ display:grid; grid-template-columns:minmax(0,4fr) minmax(0,8fr); gap:clamp(24px,4vw,56px); align-items:start; }
.demo-steps{ list-style:none; margin:0; padding:0; border-left:1px solid var(--rule); }
.demo-steps li button{ display:block; width:100%; text-align:left; background:none; border:0; padding:16px 0 16px 22px; cursor:pointer; position:relative; }
.demo-steps li button::before{ content:""; position:absolute; left:-1px; top:0; bottom:0; width:2px; background:transparent; }
.demo-steps li button[aria-selected="true"]::before{ background:var(--navy); }
.demo-steps .st-n{ font-size:12.5px; color:var(--ink-3); display:block; }
.demo-steps .st-t{ font-size:17px; font-weight:600; display:block; color:var(--ink-2); }
.demo-steps [aria-selected="true"] .st-t{ color:var(--ink); }
.demo-steps .st-d{ display:none; color:var(--ink-2); font-size:14.5px; margin-top:4px; max-width:34em; }
.demo-steps [aria-selected="true"] .st-d{ display:block; }
.demo-steps .st-prog{ position:absolute; left:-1px; top:0; width:2px; height:0; background:var(--sage); }
.stage{ position:relative; aspect-ratio:16/10; background:var(--paper); border:1px solid var(--rule); overflow:hidden; }
.scene{ position:absolute; inset:0; padding:clamp(18px,3vw,34px); opacity:0; visibility:hidden; transition:opacity .35s; }
.scene.on{ opacity:1; visibility:visible; }

/* Domains carousel */
.car-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:32px; }
.car-ctrl{ display:flex; align-items:center; gap:8px; }
.car-count{ font-size:13px; color:var(--ink-3); min-width:52px; text-align:center; }
.car-track{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(280px,calc((100% - 48px)/3.2)); gap:24px;
  overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth; padding-bottom:6px; scrollbar-width:none; }
.car-track::-webkit-scrollbar{ display:none; }
.dom{ scroll-snap-align:start; position:relative; display:flex; flex-direction:column; }
.dom-img{ position:relative; aspect-ratio:4/5; overflow:hidden; background:var(--paper-2); }
.dom-img canvas{ width:100%; height:100%; object-fit:cover; transition:transform .6s ease; }
.dom:hover .dom-img canvas{ transform:scale(1.03); }
.dom-img::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,20,30,0) 45%,rgba(10,20,30,.72) 100%); }
.dom-txt{ position:absolute; left:0; right:0; bottom:0; padding:22px; color:#fff; z-index:1; }
.dom-txt h3{ color:#fff; font-size:21px; font-weight:600; }
.dom-txt p{ font-size:14px; color:rgba(255,255,255,.88); margin-top:6px; line-height:1.5; }
.dom-foot{ padding:14px 0 0; font-size:14px; color:var(--ink-2); border-bottom:1px solid var(--rule); padding-bottom:14px; }
.dom-foot q{ display:block; color:var(--ink); quotes:"“" "”"; }
.dom-foot a{ display:inline-block; margin-top:8px; font-weight:500; font-size:14px; }

/* USP comparison */
.usp-grid{ display:grid; grid-template-columns:minmax(0,4fr) minmax(0,8fr); gap:clamp(32px,5vw,72px); }
.cmp{ width:100%; border-collapse:collapse; font-size:15px; }
.cmp th{ text-align:left; font-size:13px; font-weight:600; color:var(--ink-2); padding:0 16px 12px 0; border-bottom:1px solid var(--ink); }
.cmp td{ padding:18px 16px 18px 0; border-bottom:1px solid var(--rule); vertical-align:top; }
.cmp td:first-child{ font-weight:600; width:26%; }
.cmp td:nth-child(2){ color:var(--ink-3); width:30%; }
.cmp td:nth-child(3){ color:var(--ink); }

/* Methodology: horizontal, scroll-driven process */
.method{ position:relative; }
.method-pin{ position:sticky; top:calc(var(--hdr) + env(safe-area-inset-top,0px)); height:calc(100vh - var(--hdr)); display:flex; flex-direction:column; justify-content:center; overflow:hidden; }
.method-rail{ position:relative; height:3px; background:var(--rule); margin:36px 0 0; }
.method-rail i{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--navy); }
.method-track{ display:flex; will-change:transform; }
.mstage{ flex:0 0 clamp(260px,30vw,360px); padding:0 36px 0 0; position:relative; }
.mstage::before{ content:""; position:absolute; left:0; top:-40px; height:34px; border-left:1px dashed var(--rule-2); }
.mstage .ms-k{ font-size:12.5px; color:var(--ink-3); margin:18px 0 6px; display:block; }
.mstage h3{ font-size:22px; font-weight:600; color:var(--ink-3); transition:color .3s; }
.mstage p{ font-size:15px; color:var(--ink-3); margin-top:10px; max-width:30em; transition:color .3s; }
.mstage .ms-io{ margin-top:14px; font-size:12.5px; color:var(--ink-3); border-top:1px solid var(--rule); padding-top:10px; }
.mstage.on h3{ color:var(--ink); } .mstage.on p{ color:var(--ink-2); } .mstage.on .ms-io{ color:var(--green); }
.mstage.on::before{ border-left-color:var(--navy); }
.method-pulse{ position:absolute; top:-4px; width:11px; height:11px; border-radius:50%; background:#fff; border:2px solid var(--navy); transform:translateX(-5px); }

.cta-band{ padding:clamp(56px,8vw,96px) 0; background:var(--navy); color:#fff; }
.cta-band h2{ color:#fff; font-size:clamp(28px,3vw,38px); }
.cta-band p{ color:rgba(255,255,255,.82); margin-top:12px; font-size:17px; max-width:36em; }
.cta-band .btn-primary{ background:#fff; color:var(--navy); }
.cta-band .btn-primary:hover{ background:var(--paper); }
.cta-in{ display:flex; align-items:center; justify-content:space-between; gap:32px; flex-wrap:wrap; }

.ftr{ padding:40px 0 48px; border-top:1px solid var(--rule); font-size:13.5px; color:var(--ink-2); }
.ftr-in{ display:flex; justify-content:space-between; gap:32px; flex-wrap:wrap; }
.ftr-cols{ display:flex; gap:48px; flex-wrap:wrap; }
.ftr h4{ font-size:13px; font-weight:600; margin-bottom:8px; }
.ftr a{ color:var(--ink-2); text-decoration:none; display:block; line-height:1.9; }
.ftr a:hover{ color:var(--navy); text-decoration:underline; }

/* ---------- Auth ---------- */
.auth{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); min-height:calc(100vh - var(--hdr) - env(safe-area-inset-top,0px)); }
.auth-img{ position:relative; overflow:hidden; background:var(--paper-2); }
.auth-img canvas{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.auth-img .cap{ position:absolute; left:28px; bottom:24px; right:28px; color:#fff; font-size:13px; text-shadow:0 1px 3px rgba(0,0,0,.5); }
.auth-img .cap b{ display:block; font-size:22px; font-weight:600; margin-bottom:6px; line-height:1.3; max-width:22em; }
.auth-form{ display:flex; align-items:center; justify-content:center; padding:48px var(--gut); }
.auth-box{ width:100%; max-width:440px; }
.auth-box h1{ font-size:30px; font-weight:600; margin-top:28px; }
.auth-box .lead{ color:var(--ink-2); margin-top:6px; }
.tabs-line{ display:flex; gap:24px; border-bottom:1px solid var(--rule); margin-top:28px; }
.tabs-line button{ background:none; border:0; padding:10px 0; font-size:15px; color:var(--ink-2); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
.tabs-line button[aria-selected="true"]{ color:var(--navy); font-weight:600; border-bottom-color:var(--navy); }
.field{ margin-top:18px; }
.field label, .field .lbl{ display:block; font-size:14px; font-weight:500; margin-bottom:6px; }
.field .hint{ font-size:13px; color:var(--ink-3); margin-top:5px; }
.input, select.input, textarea.input{ width:100%; height:44px; padding:0 12px; border:1px solid var(--rule-2); border-radius:var(--r); background:#fff; font:inherit; font-size:15px; color:var(--ink); }
textarea.input{ height:auto; min-height:92px; padding:11px 12px; resize:vertical; line-height:1.5; }
.input:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(33,78,107,.14); }
.input[aria-invalid="true"]{ border-color:var(--fail); }
.err{ color:var(--fail); font-size:13.5px; margin-top:10px; }
.bg-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.bg-opt{ position:relative; }
.bg-opt input{ position:absolute; opacity:0; }
.bg-opt label{ display:block; margin:0; padding:9px 11px; border:1px solid var(--rule-2); border-radius:var(--r); font-size:13.5px; font-weight:400; cursor:pointer; line-height:1.35; }
.bg-opt input:checked + label{ border-color:var(--navy); background:var(--blue-soft); color:var(--navy); font-weight:500; }
.bg-opt input:focus-visible + label{ outline:2px solid var(--blue); outline-offset:2px; }
.auth-foot{ margin-top:32px; padding-top:16px; border-top:1px solid var(--rule); font-size:12.5px; color:var(--ink-3); }

/* ---------- App shell ---------- */
.app-top{ border-bottom:1px solid var(--rule); background:#fff; }
.app-top .wrap{ padding-top:22px; padding-bottom:18px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
.app-top h1{ font-size:26px; font-weight:600; }
.app-top p{ color:var(--ink-2); font-size:14.5px; margin-top:2px; }
.ws{ display:grid; grid-template-columns:360px minmax(0,1fr); min-height:calc(100vh - var(--hdr) - 90px); }
.ws-side{ border-right:1px solid var(--rule); background:var(--paper); padding:24px 24px 40px; }
.ws-main{ padding:24px var(--gut) 64px; min-width:0; }
.side-sec{ padding-bottom:22px; margin-bottom:22px; border-bottom:1px solid var(--rule); }
.side-sec:last-child{ border-bottom:0; }
.side-h{ font-size:14px; font-weight:600; margin-bottom:10px; display:flex; justify-content:space-between; align-items:baseline; }
.side-h small{ font-weight:400; color:var(--ink-3); font-size:12.5px; }
.seg{ display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--rule-2); border-radius:var(--r); overflow:hidden; background:#fff; }
.seg button{ border:0; background:#fff; padding:9px 6px; font-size:13px; cursor:pointer; color:var(--ink-2); line-height:1.3; }
.seg button + button{ border-left:1px solid var(--rule-2); }
.seg button[aria-pressed="true"]{ background:var(--navy); color:#fff; font-weight:500; }
.seg-note{ font-size:12.5px; color:var(--ink-3); margin-top:8px; }
.drop{ border:1px dashed var(--rule-2); border-radius:var(--r); background:#fff; padding:12px; margin-top:10px; }
.drop.over{ border-color:var(--blue); background:var(--blue-soft); }
.drop-row{ display:flex; align-items:center; gap:10px; }
.drop-tag{ font-size:12px; font-weight:600; color:var(--navy); background:var(--blue-soft); padding:2px 7px; border-radius:3px; flex:none; }
.drop-name{ font-size:13.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.drop-meta{ font-size:12px; color:var(--ink-3); margin-top:6px; }
.drop-empty{ font-size:13.5px; color:var(--ink-2); }
.drop-empty button{ background:none; border:0; color:var(--blue); text-decoration:underline; cursor:pointer; padding:0; font-size:13.5px; }
.drop-bad{ color:var(--fail); font-size:12.5px; margin-top:6px; }
.parse{ margin-top:8px; font-size:12.5px; color:var(--ink-2); display:flex; flex-wrap:wrap; gap:6px; align-items:center; min-height:22px; }
.tag{ display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:2px 8px; border-radius:3px; background:#fff; border:1px solid var(--rule-2); color:var(--ink-2); white-space:nowrap; }
.tag-task{ background:var(--navy); border-color:var(--navy); color:#fff; font-weight:500; }
.tag-syn{ background:var(--ochre-soft); border-color:var(--warn-line); color:var(--warn); font-weight:500; }
.tag-ok{ background:var(--green-soft); border-color:#BFD5CB; color:var(--green); }
.suggest{ display:flex; flex-direction:column; gap:2px; margin-top:8px; }
.suggest button{ text-align:left; background:none; border:0; padding:5px 0; font-size:13.5px; color:var(--blue); cursor:pointer; }
.suggest button:hover{ text-decoration:underline; }
.scenes{ display:flex; flex-direction:column; }
.scene-btn{ display:grid; grid-template-columns:56px minmax(0,1fr); gap:12px; align-items:center; text-align:left; background:none; border:0; border-top:1px solid var(--rule); padding:10px 0; cursor:pointer; }
.scene-btn:hover .sc-t{ color:var(--navy); text-decoration:underline; }
.scene-btn canvas{ width:56px; height:42px; object-fit:cover; }
.sc-t{ font-size:13.5px; font-weight:500; display:block; line-height:1.35; }
.sc-d{ font-size:12px; color:var(--ink-3); display:block; }

/* Empty state */
.empty{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:40px; align-items:center; padding:32px 0; }
.empty h2{ font-size:26px; font-weight:600; }
.empty ol{ padding-left:20px; color:var(--ink-2); margin:16px 0 0; }
.empty ol li{ padding:4px 0; }

/* ---------- Analysis pipeline (loading) ---------- */
.pipe{ border:1px solid var(--rule); background:#fff; }
.pipe-head{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:18px 22px; border-bottom:1px solid var(--rule); flex-wrap:wrap; }
.pipe-head h2{ font-size:19px; font-weight:600; }
.pipe-body{ display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); }
.pipe-vis{ position:relative; background:var(--paper); padding:22px; border-right:1px solid var(--rule); display:flex; flex-direction:column; gap:12px; }
.thumbs{ display:grid; gap:10px; }
.thumbs.two{ grid-template-columns:1fr 1fr; }
.thumb{ position:relative; overflow:hidden; background:#DAD7D0; aspect-ratio:1/1; }
.thumb canvas{ width:100%; height:100%; }
.thumb .tl{ position:absolute; left:8px; top:8px; background:rgba(255,255,255,.94); font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:2px; color:var(--navy); }
.scan{ position:absolute; border:1.5px solid rgba(255,255,255,.95); box-shadow:0 0 0 9999px rgba(12,22,32,.18); width:34%; height:34%; left:0; top:0; transition:left .9s ease, top .9s ease, width .9s ease, height .9s ease, opacity .3s; opacity:0; }
.scan.on{ opacity:1; }
.scan::before,.scan::after{ content:""; position:absolute; width:8px; height:8px; border-color:#fff; border-style:solid; }
.scan::before{ left:-4px; top:-4px; border-width:2px 0 0 2px; } .scan::after{ right:-4px; bottom:-4px; border-width:0 2px 2px 0; }
.tbox{ position:absolute; border:1.5px solid #F2C45A; opacity:0; transform:scale(1.25); transition:opacity .25s, transform .25s; }
.tbox.on{ opacity:1; transform:none; }
.tmask{ position:absolute; inset:0; opacity:0; transition:opacity .6s; }
.tmask.on{ opacity:1; }
.pipe-stage{ padding:22px; display:flex; flex-direction:column; gap:18px; min-width:0; }
.rail{ position:relative; display:grid; grid-template-columns:repeat(7,1fr); padding-top:4px; }
.rail-line{ position:absolute; left:calc(100%/14); right:calc(100%/14); top:13px; height:2px; background:var(--rule); }
.rail-line i{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--green); transition:width .5s ease; }
.node{ position:relative; display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; }
.node .dot{ width:20px; height:20px; border-radius:50%; background:#fff; border:1.5px solid var(--rule-2); display:grid; place-items:center; position:relative; z-index:1; transition:all .3s; }
.node .nl{ font-size:11.5px; color:var(--ink-3); line-height:1.25; }
.node.done .dot{ background:var(--green); border-color:var(--green); }
.node.done .dot::after{ content:""; width:8px; height:4px; border:solid #fff; border-width:0 0 2px 2px; transform:translateY(-1px) rotate(-45deg); }
.node.done .nl{ color:var(--ink-2); }
.node.active .dot{ width:26px; height:26px; margin-top:-3px; border:2px solid var(--navy); }
.node.active .dot::after{ content:""; position:absolute; inset:4px; border-radius:50%; border:2px solid var(--navy); border-top-color:transparent; animation:spin 1.4s linear infinite; }
.node.active .nl{ color:var(--navy); font-weight:600; }
.node.failed .dot{ background:var(--fail); border-color:var(--fail); }
.node.failed .dot::after{ content:"!"; color:#fff; font-size:12px; font-weight:700; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.now{ border-top:1px solid var(--rule); padding-top:16px; }
.now-k{ font-size:12.5px; color:var(--ink-3); }
.now-t{ font-size:18px; font-weight:600; margin-top:2px; }
.now-d{ font-size:14.5px; color:var(--ink-2); margin-top:4px; }
.ctx{ min-height:150px; }
.chips{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{ padding:7px 12px; border:1px solid var(--rule-2); border-radius:var(--r); font-size:13px; color:var(--ink-3); background:#fff; transition:all .3s; }
.chip.hit{ border-color:var(--navy); background:var(--navy); color:#fff; font-weight:500; }
.qtrans{ display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:12px; align-items:center; }
.qtrans .qq{ font-size:14.5px; color:var(--ink); border-left:2px solid var(--rule-2); padding-left:12px; }
.toollist{ display:flex; flex-direction:column; gap:0; }
.trow{ display:grid; grid-template-columns:22px minmax(0,150px) minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--rule); font-size:13.5px; opacity:.45; transition:opacity .3s; }
.trow.seen{ opacity:1; }
.trow .tn{ font-weight:600; }
.trow .ts{ color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.trow .tr{ font-size:12px; color:var(--ink-3); }
.sdot{ width:10px; height:10px; border-radius:50%; border:1.5px solid var(--rule-2); margin:0 auto; }
.trow.running .sdot{ border-color:var(--navy); animation:pulse 1.2s ease infinite; }
.trow.ok .sdot{ background:var(--green); border-color:var(--green); }
.trow.skipped .sdot{ background:var(--rule-2); }
.trow.failed .sdot{ background:var(--fail); border-color:var(--fail); }
@keyframes pulse{ 50%{ box-shadow:0 0 0 5px rgba(23,50,77,.12); } }
.src{ font-size:11px; padding:1px 6px; border-radius:3px; border:1px solid var(--rule-2); color:var(--ink-3); }
.src-fake{ color:var(--warn); border-color:var(--warn-line); background:var(--warn-soft); }
.src-real{ color:var(--green); border-color:#BFD5CB; background:var(--green-soft); }
.fuse svg{ width:100%; height:auto; }
.flow{ stroke-dasharray:4 6; animation:flow 1.2s linear infinite; }
@keyframes flow{ to{ stroke-dashoffset:-20; } }

/* ---------- Result ---------- */
.res-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; }
.res-q{ font-size:14.5px; color:var(--ink-2); max-width:60em; }
.res-q b{ color:var(--ink); font-weight:500; }
.res-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.rtabs{ display:flex; align-items:center; gap:4px; border-bottom:1px solid var(--rule); margin-top:18px; position:sticky; top:calc(var(--hdr) + env(safe-area-inset-top,0px)); background:#fff; z-index:5; }
.rtabs [role="tab"]{ background:none; border:0; padding:12px 14px; font-size:14.5px; color:var(--ink-2); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
.rtabs [role="tab"][aria-selected="true"]{ color:var(--navy); font-weight:600; border-bottom-color:var(--navy); }
.rtabs .spacer{ flex:1; }
.panel{ padding-top:24px; }
.answer{ display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:0; border:1px solid var(--rule); }
.answer-main{ padding:24px 26px; }
.answer-k{ font-size:12.5px; font-weight:600; color:var(--green); display:flex; align-items:center; gap:8px; }
.answer-t{ font-size:clamp(21px,2vw,26px); line-height:1.4; font-weight:500; margin-top:10px; letter-spacing:-.01em; max-width:40em; }
.num{ font:inherit; font-weight:600; color:var(--navy); background:var(--blue-soft); border:0; border-bottom:1.5px solid var(--navy); padding:0 3px; cursor:pointer; border-radius:2px 2px 0 0; }
.num:hover{ background:#D7E4EE; }
.answer-note{ font-size:13px; color:var(--ink-3); margin-top:12px; }
.conf{ border-left:1px solid var(--rule); padding:22px 22px; background:var(--paper); }
.conf-k{ font-size:12.5px; color:var(--ink-2); }
.conf-v{ display:flex; align-items:baseline; gap:10px; margin-top:4px; }
.conf-v b{ font-size:34px; font-weight:600; letter-spacing:-.02em; line-height:1; }
.conf-v span{ font-size:15px; font-weight:600; }
.bar{ height:6px; background:var(--rule); border-radius:3px; margin-top:12px; position:relative; overflow:hidden; }
.bar i{ position:absolute; left:0; top:0; bottom:0; background:var(--green); border-radius:3px; }
.bar-scale{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-3); margin-top:3px; }
.comps{ margin-top:14px; display:grid; gap:7px; }
.comp{ display:grid; grid-template-columns:92px 1fr 36px; gap:8px; align-items:center; font-size:12px; color:var(--ink-2); }
.comp .bar{ margin:0; height:4px; }
.comp .bar i{ background:var(--sage); }
.comp em{ font-style:normal; text-align:right; color:var(--ink); }
.reasons{ list-style:none; padding:0; margin:14px 0 0; font-size:13px; color:var(--ink-2); display:grid; gap:5px; }
.reasons li{ display:grid; grid-template-columns:16px 1fr; gap:6px; line-height:1.45; }
.reasons .ok{ color:var(--ok); } .reasons .wn{ color:var(--warn); }
.conflict .conf{ background:var(--warn-soft); border-left-color:var(--warn-line); }
.conflict{ border-color:var(--warn-line); }
.conflict .bar i{ background:var(--ochre); }
.review{ display:flex; gap:14px; align-items:flex-start; border:1px solid var(--warn-line); background:var(--warn-soft); padding:16px 18px; margin-top:16px; }
.review h3{ font-size:15px; color:var(--warn); font-weight:600; }
.review ul{ margin:6px 0 0; padding-left:18px; font-size:14px; color:var(--ink); }
.review .flag{ flex:none; width:28px; height:28px; border-radius:50%; background:var(--ochre); color:#fff; display:grid; place-items:center; font-weight:700; }
.anim-in{ animation:amberIn .7s ease; }
@keyframes amberIn{ from{ background:#fff; transform:translateY(-4px); } }

.mdg{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0; border:1px solid var(--rule); border-top:0; }
.mdg > div{ padding:18px 22px; }
.mdg > div + div{ border-left:1px solid var(--rule); }
.mdg h3{ font-size:13px; font-weight:600; color:var(--ink-2); }
.mdg .facts-mini{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px 20px; margin-top:10px; }
.fm b{ display:block; font-size:19px; font-weight:600; letter-spacing:-.01em; }
.fm span{ font-size:12.5px; color:var(--ink-3); }
.vlm-q{ margin-top:10px; font-size:15.5px; font-style:italic; color:var(--ink); border-left:2px solid var(--rule-2); padding-left:12px; }
.model-id{ display:inline-block; margin-top:10px; font-family:var(--mono); font-size:12px; background:var(--paper); border:1px solid var(--rule); padding:3px 8px; border-radius:3px; color:var(--navy); word-break:break-all; }

.blk{ margin-top:36px; }
.blk-h{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:12px; flex-wrap:wrap; }
.blk-h h2{ font-size:19px; font-weight:600; }
.blk-h p{ font-size:13.5px; color:var(--ink-3); }

/* Evidence viewer (landscape map) */
.viewer{ display:grid; grid-template-columns:minmax(0,1fr) 230px; border:1px solid var(--rule); }
.vcanvas{ position:relative; aspect-ratio:16/9; max-height:62vh; min-height:280px; background:#E4E2DC; overflow:hidden; cursor:grab; touch-action:none; }
.vcanvas.drag{ cursor:grabbing; }
.vcanvas canvas{ position:absolute; inset:0; width:100%; height:100%; }
.vmodes{ position:absolute; left:12px; top:12px; display:flex; background:#fff; border:1px solid var(--rule-2); border-radius:var(--r); overflow:hidden; z-index:2; }
.vmodes button{ border:0; background:#fff; font-size:13px; padding:6px 11px; cursor:pointer; color:var(--ink-2); }
.vmodes button + button{ border-left:1px solid var(--rule-2); }
.vmodes button[aria-pressed="true"]{ background:var(--navy); color:#fff; }
.vzoom{ position:absolute; right:12px; top:12px; display:flex; flex-direction:column; z-index:2; }
.vzoom button{ width:32px; height:32px; background:#fff; border:1px solid var(--rule-2); cursor:pointer; font-size:17px; line-height:1; }
.vzoom button + button{ border-top:0; }
.vread{ position:absolute; left:12px; bottom:10px; z-index:2; display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
.vread .rd:empty{ display:none; }
.vread .rd{ background:rgba(255,255,255,.94); font-family:var(--mono); font-size:11px; padding:3px 7px; color:var(--ink); border-radius:2px; }
.scalebar{ background:rgba(255,255,255,.94); padding:4px 7px 3px; border-radius:2px; font-family:var(--mono); font-size:11px; }
.scalebar i{ display:block; height:5px; border:1.5px solid var(--ink); border-top:0; margin-bottom:2px; }
.vhandle{ position:absolute; top:0; bottom:0; width:2px; background:#fff; z-index:3; cursor:ew-resize; box-shadow:0 0 0 1px rgba(0,0,0,.2); }
.vhandle button{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:30px; height:30px; border-radius:50%; background:#fff; border:1px solid var(--rule-2); cursor:ew-resize; font-size:12px; color:var(--navy); }
.vlbl{ position:absolute; top:52px; z-index:2; background:rgba(255,255,255,.94); font-size:11.5px; font-weight:600; padding:2px 7px; color:var(--navy); border-radius:2px; }
.layers{ border-left:1px solid var(--rule); padding:14px 16px; font-size:13.5px; overflow:auto; max-height:62vh; }
.layers h3{ font-size:13px; font-weight:600; color:var(--ink-2); margin-bottom:8px; }
.lyr{ display:flex; align-items:center; gap:9px; padding:5px 0; cursor:pointer; }
.lyr input{ margin:0; accent-color:var(--navy); width:15px; height:15px; }
.sw{ width:14px; height:14px; border-radius:2px; flex:none; border:1px solid rgba(0,0,0,.15); }
.sw.outline{ background:transparent!important; border-width:2px; }
.sw.box{ background:transparent!important; border-width:2px; border-radius:0; }
.lyr small{ margin-left:auto; color:var(--ink-3); font-size:11.5px; }
.meta-dl{ display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:12px; margin-top:14px; padding-top:12px; border-top:1px solid var(--rule); }
.meta-dl dt{ color:var(--ink-3); } .meta-dl dd{ margin:0; font-family:var(--mono); font-size:11.5px; word-break:break-word; }

/* Tables */
.tbl-wrap{ overflow-x:auto; }
.tbl{ width:100%; border-collapse:collapse; font-size:14px; }
.tbl th{ text-align:left; font-size:12.5px; font-weight:600; color:var(--ink-2); padding:9px 12px 9px 0; border-bottom:1px solid var(--ink); white-space:nowrap; }
.tbl td{ padding:10px 12px 10px 0; border-bottom:1px solid var(--rule); vertical-align:top; }
.tbl td.n{ font-variant-numeric:tabular-nums; }
.tbl tr.click{ cursor:pointer; }
.tbl tr.click:hover td{ background:var(--paper); }
.linkish{ background:none; border:0; padding:0; color:var(--blue); cursor:pointer; text-decoration:underline; font-size:inherit; }

/* Count-off & adapter A/B */
.duo{ display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--rule); }
.duo > div{ padding:18px 22px; }
.duo > div + div{ border-left:1px solid var(--rule); }
.duo .k{ font-size:12.5px; font-weight:600; color:var(--ink-2); }
.duo .v{ font-size:26px; font-weight:600; margin-top:6px; letter-spacing:-.01em; }
.duo .v.est{ color:var(--ink-3); font-style:italic; font-weight:500; font-size:22px; }
.duo .s{ font-size:13px; color:var(--ink-3); margin-top:6px; }
.duo .measured{ background:var(--green-soft); }

/* Summary + trace */
.kv{ display:grid; grid-template-columns:200px minmax(0,1fr); border-top:1px solid var(--rule); }
.kv > dt, .kv > dd{ padding:11px 0; border-bottom:1px solid var(--rule); margin:0; font-size:14.5px; }
.kv > dt{ color:var(--ink-2); padding-right:16px; }
.adapter{ background:var(--ochre-soft); border:1px solid var(--warn-line); padding:1px 7px; border-radius:3px; font-family:var(--mono); font-size:12.5px; color:var(--warn); }
.tl{ list-style:none; margin:0; padding:0; position:relative; }
.tl::before{ content:""; position:absolute; left:9px; top:8px; bottom:8px; width:1px; background:var(--rule-2); }
.tl > li{ position:relative; padding:0 0 0 34px; margin-bottom:10px; }
.tl .tdot{ position:absolute; left:3px; top:15px; width:13px; height:13px; border-radius:50%; background:#fff; border:2px solid var(--green); }
.tl .tdot.skip{ border-color:var(--rule-2); } .tl .tdot.fail{ border-color:var(--fail); background:var(--fail); }
.tl details{ border:1px solid var(--rule); background:#fff; }
.tl details[open]{ border-color:var(--rule-2); }
.tl summary{ list-style:none; cursor:pointer; padding:11px 14px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; }
.tl summary::-webkit-details-marker{ display:none; }
.tl summary .st{ font-weight:600; font-size:14.5px; }
.tl summary .ss{ font-size:13.5px; color:var(--ink-2); display:block; font-weight:400; }
.tl summary .sm{ display:flex; gap:8px; align-items:center; font-size:12px; color:var(--ink-3); }
.tl summary .chev{ width:8px; height:8px; border:solid var(--ink-3); border-width:0 1.5px 1.5px 0; transform:rotate(45deg); transition:transform .2s; margin-left:4px; }
.tl details[open] .chev{ transform:rotate(-135deg); }
.tl .tb{ padding:4px 14px 14px; border-top:1px solid var(--rule); font-size:13.5px; }
.tl.hl > li.flash details{ box-shadow:0 0 0 2px var(--ochre); }
.ptable{ width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
.ptable td{ padding:5px 10px 5px 0; border-bottom:1px solid var(--rule); }
.ptable td:first-child{ font-family:var(--mono); font-size:12px; color:var(--ink-2); width:34%; }
.clamp{ color:var(--warn); font-size:12px; }
.pre{ font-family:var(--mono); font-size:12px; background:var(--paper); border:1px solid var(--rule); padding:12px; overflow:auto; max-height:420px; white-space:pre; }

/* Export */
.exp{ display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid var(--rule); }
.exp > div{ padding:22px 24px; }
.exp > div + div{ border-left:1px solid var(--rule); }
.exp h3{ font-size:17px; font-weight:600; }
.exp p{ font-size:14px; color:var(--ink-2); margin:6px 0 16px; }
.exp ul{ font-size:13.5px; color:var(--ink-2); padding-left:18px; margin:0 0 18px; }

/* Receipt popover */
.receipt{ position:fixed; z-index:60; width:340px; max-width:calc(100vw - 24px); background:#fff; border:1px solid var(--rule-2); box-shadow:0 8px 28px rgba(16,30,45,.14); border-radius:var(--r2); }
.receipt header{ padding:12px 16px; border-bottom:1px dashed var(--rule-2); display:flex; justify-content:space-between; align-items:center; }
.receipt header b{ font-size:14px; }
.receipt dl{ margin:0; padding:10px 16px 14px; display:grid; grid-template-columns:78px 1fr; gap:7px 10px; font-size:13px; }
.receipt dt{ color:var(--ink-3); } .receipt dd{ margin:0; word-break:break-word; }
.receipt footer{ padding:10px 16px; border-top:1px solid var(--rule); background:var(--paper); }
.x-btn{ background:none; border:0; font-size:18px; cursor:pointer; color:var(--ink-3); line-height:1; padding:2px 6px; }

/* History / registry */
.page{ padding-top:28px; padding-bottom:72px; }
.filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.filters .input{ width:auto; min-width:220px; height:38px; }
.lbl-chip{ font-size:12px; font-weight:600; padding:2px 7px; border-radius:3px; }
.lbl-High{ background:var(--green-soft); color:var(--green); }
.lbl-Medium{ background:var(--blue-soft); color:var(--blue); }
.lbl-Low{ background:var(--paper-2); color:var(--ink-2); }
.lbl-Conflict{ background:var(--warn-soft); color:var(--warn); }
.reg{ display:grid; grid-template-columns:1fr; }
.reg-item{ display:grid; grid-template-columns:minmax(0,4fr) minmax(0,5fr); gap:32px; padding:24px 0; border-top:1px solid var(--rule); }
.reg-item h3{ font-size:18px; font-weight:600; }
.reg-item .own{ font-size:12.5px; color:var(--ink-3); }
.reg-item p{ color:var(--ink-2); font-size:14.5px; margin-top:6px; }
.rng{ display:grid; grid-template-columns:130px 1fr 110px; gap:10px; align-items:center; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--rule); }
.rng .track{ position:relative; height:4px; background:var(--rule); border-radius:2px; }
.rng .track i{ position:absolute; top:-4px; width:2px; height:12px; background:var(--navy); }
.rng code{ font-family:var(--mono); font-size:11.5px; color:var(--ink-2); }

<script>
/* =====================================================================
   SatQuery AI — web client (single-file preview build)
   ---------------------------------------------------------------------
   Data rules followed here (from the Master Document / P3 handover):
   * The browser never receives raw GeoTIFFs; it shows rendered images,
     overlays and GeoJSON only.
   * Every result shown is either (a) a JobResult from the SatQuery API
     server, or (b) a SYNTHETIC result computed in this page from the
     documented synthetic fixture (Master F3.7). Synthetic results are
     labelled synthetic everywhere they appear.
   ===================================================================== */
'use strict';

/* ---------------- small utilities ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d = 0) => Number(n).toLocaleString('en-IN', { maximumFractionDigits: d, minimumFractionDigits: d });
const pct = v => Math.round(v * 100);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function store(key, val) { try { if (val === undefined) { const v = localStorage.getItem('sq.' + key); return v ? JSON.parse(v) : null; } localStorage.setItem('sq.' + key, JSON.stringify(val)); } catch (e) { return null; } }
function storeDel(key) { try { localStorage.removeItem('sq.' + key); } catch (e) { } }

/* ---------------- deterministic noise ---------------- */
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function hash2(a, b, s) { let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function noiseGen(seed) {
  const r = rng(seed), perm = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const p = new Uint8Array(512); for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const g = new Float32Array(256); for (let i = 0; i < 256; i++) g[i] = r();
  function n2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
    const a = g[p[p[X] + Y]], b = g[p[p[X + 1] + Y]], c = g[p[p[X] + Y + 1]], d = g[p[p[X + 1] + Y + 1]];
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y, o = 5) { let s = 0, a = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * n2(x * f, y * f); n += a; a *= .5; f *= 2.03; } return s / n; }
  return { n2, fbm };
}
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const shade = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const sstep = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
function pixels(w, h, fn) {
  const c = mkCanvas(w, h), ctx = c.getContext('2d'), im = ctx.createImageData(w, h), d = im.data;
  for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i += 4) { const col = fn(x, y); d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255; }
  ctx.putImageData(im, 0, 0); return c;
}

/* =====================================================================
   RENDERED ILLUSTRATIONS for the marketing pages.
   These are procedurally rendered Earth-observation-style scenes, used
   because this preview cannot load external images. They are captioned
   as renders. See ASSETS note in the delivery summary for the licensed
   satellite imagery that should replace them in production.
   ===================================================================== */
const PAL = {
  crops: [[92, 116, 60], [108, 126, 68], [138, 130, 94], [158, 144, 110], [80, 102, 56], [124, 118, 78], [170, 158, 126], [98, 112, 66], [120, 134, 80]],
  veg: [70, 90, 52], vegD: [44, 62, 40], soil: [156, 138, 108], sand: [196, 184, 156], dry: [170, 152, 118],
  water: [30, 52, 66], waterS: [58, 86, 94], turbid: [104, 100, 80], roof: [176, 170, 160], road: [128, 124, 116], mud: [118, 108, 86]
};
function fieldsFn(N, seed, o = {}) {
  const ang = o.angle ?? .35, ca = Math.cos(ang), sa = Math.sin(ang), cw = o.cw ?? 44, ch = o.ch ?? 28, pal = o.pal || PAL.crops;
  return (x, y) => {
    const wx = x + (N.fbm(x / 220, y / 220, 3) - .5) * 60, wy = y + (N.fbm(x / 220 + 9, y / 220 + 3, 3) - .5) * 60;
    const u = wx * ca + wy * sa, v = -wx * sa + wy * ca;
    const row = Math.floor(v / ch), cw2 = cw * (.6 + hash2(row, 7, seed) * .9);
    const uu = u + hash2(row, 3, seed) * cw2, col = Math.floor(uu / cw2);
    const fu = uu / cw2 - col, fv = v / ch - row;
    let c = pal[Math.floor(hash2(col, row, seed) * pal.length)];
    const tex = .9 + .18 * N.n2(x / 3.1, y / 3.1) + .04 * Math.sin(u * 1.4);
    c = shade(c, tex);
    if (fu < .045 || fv < .06) c = mix(c, [72, 80, 58], .55);
    return c;
  };
}
function riverDist(x, y, N, o) { const cy = o.y0 + o.A * Math.sin(x / o.L + o.ph) + (N.fbm(x / 160, 3.3, 3) - .5) * o.B; return Math.abs(y - cy); }
function urbanPix(x, y, seed, o = {}) {
  const bs = o.block ?? 30, st = o.street ?? 4, bx = Math.floor(x / bs), by = Math.floor(y / bs), fx = x - bx * bs, fy = y - by * bs;
  if (fx < st || fy < st) return shade(PAL.road, .95 + hash2(bx, by, 9) * .1);
  if (hash2(bx, by, seed + 5) < (o.park ?? .06)) return shade(PAL.veg, .9 + .2 * hash2(x, y, 3));
  const lx = fx - st, ly = fy - st, lot = 7 + Math.floor(hash2(bx, by, seed) * 4), ix = Math.floor(lx / lot), iy = Math.floor(ly / lot);
  const px = lx - ix * lot, py = ly - iy * lot;
  if (px >= lot - 1.5 || py >= lot - 1.5) return [92, 90, 86];            // shadow side
  const h = hash2(ix + bx * 31, iy + by * 17, seed);
  const r = h < .15 ? [150, 92, 76] : h < .3 ? [196, 192, 184] : h < .45 ? [132, 140, 146] : shade(PAL.roof, .85 + h * .25);
  return px < 1 || py < 1 ? shade(r, 1.08) : r;
}
function hillshade(N, x, y, s) { const e = N.fbm(x / s, y / s), ex = N.fbm((x + 1) / s, y / s) - N.fbm((x - 1) / s, y / s), ey = N.fbm(x / s, (y + 1) / s) - N.fbm(x / s, (y - 1) / s); return { e, sh: Math.max(.55, Math.min(1.35, 1 - (ex + ey) * s * .9)) }; }

const SCENES = {
  hero(w, h) { // river delta: fields, a town at the river bend, coast in the lower left
    const N = noiseGen(11), F = fieldsFn(N, 11, { angle: .42, cw: 40, ch: 26 }), N2 = noiseGen(12);
    return pixels(w, h, (x, y) => {
      const sea = N2.fbm(x / 260, y / 260, 4) * 1.1 - (x / w) * .55 + (y / h) * .45;
      if (sea > .78) { const d = sstep(.78, .95, sea); return mix(mix(PAL.waterS, [70, 102, 104], (1 - d) * .6), PAL.water, d); }
      if (sea > .755) return shade(PAL.sand, .95 + .08 * N.n2(x / 2, y / 2));
      const rd = riverDist(x, y, N, { y0: h * .42 + x * .18, A: h * .09, L: w / 5.2, ph: 1.2, B: 60 });
      const rw = 7 + x / w * 9;
      if (rd < rw) return mix(PAL.waterS, [84, 104, 98], sstep(rw * .7, rw, rd));
      if (rd < rw + 3) return shade(PAL.mud, 1.05);
      const tx = x - w * .6, ty = y - h * .36, town = Math.hypot(tx, ty * 1.3) / (w * .16) + (N.fbm(x / 70, y / 70, 3) - .5) * .7;
      if (town < 1 && rd > rw + 6) return urbanPix(x, y, 21, { block: 26 });
      if (rd < rw + 16) return shade(PAL.veg, .85 + .3 * N.n2(x / 2.5, y / 2.5));
      return F(x, y);
    });
  },
  agri(w, h) { const N = noiseGen(31), F = fieldsFn(N, 31, { angle: .08, cw: 34, ch: 22 }); return pixels(w, h, (x, y) => { const c = Math.abs((x + y * .15) % 150 - 75); if (c < 2) return [74, 96, 104]; return F(x, y); }); },
  flood(w, h) {
    const N = noiseGen(41), F = fieldsFn(N, 41, { angle: .3, cw: 40, ch: 26, pal: PAL.crops.map(c => shade(c, .92)) });
    return pixels(w, h, (x, y) => {
      const f = N.fbm(x / 170 + 4, y / 170, 5), rd = riverDist(x, y, N, { y0: h * .5, A: h * .12, L: w / 3.5, ph: .5, B: 50 });
      if (rd < 10) return [72, 78, 70];
      if (f < .53 - rd / 1400) return mix(PAL.turbid, [82, 86, 76], sstep(.3, .47, f));
      return F(x, y);
    });
  },
  urban(w, h) {
    const N = noiseGen(51);
    return pixels(w, h, (x, y) => {
      const lake = Math.hypot((x - w * .72) / 70, (y - h * .7) / 44) + (N.fbm(x / 40, y / 40, 3) - .5) * .5;
      if (lake < 1) return PAL.waterS; if (lake < 1.12) return shade(PAL.veg, 1);
      const ring = Math.abs(Math.hypot(x - w * .3, y - h * .35) - w * .38);
      if (ring < 5) return [110, 108, 104];
      return urbanPix(x, y, 53, { block: 28, park: .08 });
    });
  },
  forest(w, h) {
    const N = noiseGen(61);
    return pixels(w, h, (x, y) => {
      const road = Math.abs(y - (h * .3 + x * .35 + Math.sin(x / 60) * 20));
      if (road < 3) return [150, 132, 100];
      const cl = N.fbm(x / 90 + 5, y / 90, 4);
      if (cl > .64) return mix(PAL.soil, PAL.dry, N.n2(x / 6, y / 6));
      const cr = N.n2(x / 3.2, y / 3.2), m = N.fbm(x / 60, y / 60, 3);
      return shade(mix(PAL.vegD, [66, 88, 50], m), .72 + cr * .5);
    });
  },
  water(w, h) {
    const N = noiseGen(71);
    return pixels(w, h, (x, y) => {
      const { e, sh } = hillshade(N, x, y, 110), res = e + (y / h) * .12 - (x / w) * .05;
      if (res < .43 && y < h * .82) return mix(PAL.water, PAL.waterS, sstep(.36, .43, res));
      if (Math.abs(y - h * .82) < 4 && x > w * .3 && x < w * .7) return [190, 186, 176];
      if (res < .45) return shade(PAL.mud, sh);
      return shade(mix(PAL.dry, PAL.veg, sstep(.5, .7, e)), sh);
    });
  },
  infra(w, h) {
    const N = noiseGen(81), c = pixels(w, h, (x, y) => shade(mix(PAL.soil, PAL.dry, N.fbm(x / 80, y / 80)), .9 + .18 * N.n2(x / 3, y / 3)));
    const g = c.getContext('2d'); g.lineCap = 'round';
    const road = (d, wd, col) => { g.strokeStyle = col; g.lineWidth = wd; g.stroke(new Path2D(d)); };
    const cx = w * .5, cy = h * .5, r = w * .13;
    [[`M0 ${cy} L${w} ${cy}`, 16], [`M${cx} 0 L${cx} ${h}`, 16]].forEach(([d, wd]) => { road(d, wd + 4, '#8a8478'); road(d, wd, '#6e6c68'); road(d, 1, '#d8d4c8'); });
    for (const [sx, sy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) { g.beginPath(); g.arc(cx + sx * r, cy + sy * r, r * .8, 0, Math.PI * 2); g.strokeStyle = '#6e6c68'; g.lineWidth = 7; g.stroke(); }
    g.strokeStyle = '#4c4a46'; g.lineWidth = 3; g.setLineDash([2, 3]); g.beginPath(); g.moveTo(0, h * .15); g.lineTo(w, h * .05); g.stroke(); g.setLineDash([]);
    for (let i = 0; i < 26; i++) { const x = w * .62 + (i % 6) * 20, y = h * .66 + Math.floor(i / 6) * 16; g.fillStyle = i % 5 ? '#b9b4aa' : '#8f9aa2'; g.fillRect(x, y, 15, 10); g.fillStyle = '#5b5750'; g.fillRect(x + 15, y + 2, 2, 10); }
    return c;
  },
  env(w, h) {
    const N = noiseGen(91);
    return pixels(w, h, (x, y) => {
      const sea = (x / w) * .9 + (N.fbm(x / 200, y / 200) - .5) * .6;
      if (sea > .78) return mix([60, 92, 96], PAL.water, sstep(.78, 1, sea));
      const ch = Math.abs(N.fbm(x / 70, y / 70, 5) - .5);
      if (ch < .018 + sea * .02) return [58, 86, 88];
      if (sea > .64) return shade(PAL.mud, .95 + .1 * N.n2(x / 3, y / 3));
      return shade(mix([40, 64, 44], [70, 94, 58], N.fbm(x / 40, y / 40, 3)), .8 + .35 * N.n2(x / 2.6, y / 2.6));
    });
  },
  coast(w, h) {
    const N = noiseGen(101), c = pixels(w, h, (x, y) => {
      const land = (y / h) * 1.3 - .45 + (N.fbm(x / 150, y / 150) - .5) * .4 - (x / w) * .15;
      if (land < 0) return mix(PAL.waterS, PAL.water, sstep(0, -.35, land));
      if (land < .04) return shade(PAL.sand, 1 + .06 * N.n2(x / 2, y / 2));
      if (land > .18 && x > w * .35) return urbanPix(x, y, 103, { block: 24 });
      return shade(PAL.veg, .85 + .3 * N.n2(x / 3, y / 3));
    });
    const g = c.getContext('2d');
    g.fillStyle = '#c9c5bb'; g.fillRect(w * .52, h * .28, w * .28, 7); g.fillRect(w * .78, h * .28, 7, h * .2);
    const ships = [[.56, .22, 30, 7], [.64, .23, 26, 6], [.72, .235, 34, 8], [.3, .15, 22, 5], [.18, .3, 18, 4]];
    ships.forEach(([sx, sy, l, t]) => { g.save(); g.translate(w * sx, h * sy); g.rotate(-.05); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(2, 2, l, t); g.fillStyle = '#d9d6ce'; g.fillRect(0, 0, l, t); g.fillStyle = '#7c8890'; g.fillRect(l * .7, 1, l * .2, t - 2); g.restore(); });
    return c;
  },
  lulc(w, h) {
    const N = noiseGen(111), F = fieldsFn(N, 111, { angle: .6 }), N2 = noiseGen(113);
    return pixels(w, h, (x, y) => {
      const zone = N2.fbm(x / 240, y / 240, 3);
      if (zone < .38) return shade(mix(PAL.vegD, [70, 92, 54], N.fbm(x / 40, y / 40)), .75 + .4 * N.n2(x / 3, y / 3));
      if (zone > .62) return urbanPix(x, y, 115, { block: 24 });
      const rd = riverDist(x, y, N, { y0: h * .6, A: h * .1, L: w / 4, ph: 2, B: 40 });
      if (rd < 6) return PAL.waterS;
      return F(x, y);
    });
  },
  terrain(w, h) {
    const N = noiseGen(121);
    return pixels(w, h, (x, y) => {
      const { e, sh } = hillshade(N, x, y, 130);
      const rd = riverDist(x, y, N, { y0: h * .55 + x * -.1, A: h * .08, L: w / 3, ph: 0, B: 90 });
      if (rd < 5) return PAL.waterS;
      if (rd < 30) return shade(mix(PAL.veg, [96, 118, 64], N.n2(x / 5, y / 5)), sh);
      return shade(mix(mix(PAL.dry, PAL.veg, sstep(.35, .6, e)), [150, 146, 136], sstep(.66, .8, e)), sh);
    });
  }
};

/* =====================================================================
   SYNTHETIC FIXTURE (Master Document F3.7)
   512×512 px at 2 m, EPSG:32643, origin (500000, 2500000).
   Lake: ellipse centred (256,380), radii (120,70) at T1, (100,55) at T2.
   T1 building 12×12 at (100,100). Six new T2 buildings along the exposed
   shore. Cloudy optical ~35% cloud. SAR σ° dB: water ≈ −22, land ≈ −8,
   buildings ≈ +2, shadow patch 30×30 at (420,60) ≈ −21 on a hill with
   HAND 25–40 m. All measurements below are computed from these arrays.
   ===================================================================== */
const FX = (() => {
  const W = 512, H = 512, NPX = W * H, PIX_M = 2, E0 = 500000, N0 = 2500000;

    const vlmScore = variant === 'conflict' ? .64 : .71;
    const facts = { water_T1_m2: A(wT1), water_T2_m2: A(wT2), water_loss_m2: A(loss), water_loss_pct: +(A(loss) / A(wT1) * 100).toFixed(1), buildings_T1: dT1.length, buildings_T2: dT2.length, new_buildings: newDet.length, changed_area_m2: A(change) };
    const yes = facts.new_buildings >= 1 || facts.changed_area_m2 >= 200;
    const s7score = dT1.length ? mean(dT1.map(d => d.score)) : 0;
    const modelScores = [.88, .83, mean(dT2.map(d => d.score)), s7score, vlmScore];
    const changedFrac = newDet.map(d => { let c = 0; for (let y = d.bbox_px[1]; y < d.bbox_px[3]; y++) for (let x = d.bbox_px[0]; x < d.bbox_px[2]; x++) c += change[FX.idx(x, y)]; return c / 144; });

    const terms = { model: mean(modelScores), agreement: mean([agreeBoxes, vlmAgree]), spatial: newDet.filter(d => centreIn(d, buffered)).length / Math.max(1, newDet.length), input: mean([1 - 0 / 100, 1 - 0 / 100, 1]) };

      { step_id: 's1', tool: 'detector', inputs: { image: 'T1' }, params: { prompt: 'water body' } },
      { step_id: 's2', tool: 'select_region', inputs: { detections: '$s1', image: 'T1' }, params: { hint: 'south', buffer_m: 50, use_water: true } },
      { step_id: 's3', tool: 'water_mask', inputs: { image: 'T1', region: '$s2.masks.region' }, params: {} },
      { step_id: 's4', tool: 'water_mask', inputs: { image: 'T2', region: '$s2.masks.region' }, params: {} },

    ].map(p => ({ ...p, params: Object.assign(defaults(p.tool), p.params) }));
    const steps = [
      step('s1', 'detector', plan[0].params, `1 detection above 0.35 (water body, score 0.88)`, 1.4),

  function cloudSar() {
    const scene = SCENE('cloud-sar');

  function landcover() {
    const scene = SCENE('landcover');

  function pack(scene, task, parsed, profile, plan, steps, skipped, fusion, render) {

/* Client-side input check: TIFF/GeoTIFF header parse (no pixels are read). */
async function inspectTiff(file) {
  const out = { ok: false, name: file.name, size: file.size };
  if (!/\.(tif|tiff)$/i.test(file.name)) { out.error = 'Only GeoTIFF or TIFF files (.tif, .tiff) are accepted.'; return out; }
  if (file.size > 2 * 1024 ** 3) { out.error = 'File is larger than the 2 GB limit.'; return out; }
  try {
    const buf = await file.slice(0, Math.min(file.size, 1 << 20)).arrayBuffer(), dv = new DataView(buf);
    const bo = String.fromCharCode(dv.getUint8(0), dv.getUint8(1)); const le = bo === 'II';
    if (bo !== 'II' && bo !== 'MM') { out.error = 'Not a TIFF file (missing TIFF header).'; return out; }
    const magic = dv.getUint16(2, le);
    if (magic === 43) { out.ok = true; out.bigtiff = true; out.note = 'BigTIFF header; metadata is read on the server.'; return out; }
    if (magic !== 42) { out.error = 'Not a TIFF file (bad magic number).'; return out; }
    const ifd = dv.getUint32(4, le); if (ifd + 2 > buf.byteLength) { out.ok = true; out.note = 'Header OK; metadata is read on the server.'; return out; }
    const n = dv.getUint16(ifd, le), tags = {};
    for (let i = 0; i < n; i++) { const o = ifd + 2 + i * 12; if (o + 12 > buf.byteLength) break; const tag = dv.getUint16(o, le), type = dv.getUint16(o + 2, le), cnt = dv.getUint32(o + 4, le); const val = type === 3 ? dv.getUint16(o + 8, le) : dv.getUint32(o + 8, le); tags[tag] = { type, cnt, val }; }
    out.ok = true; out.width = tags[256]?.val; out.height = tags[257]?.val; out.bands = tags[277]?.val || 1;
    const bps = tags[258]; out.bits = bps ? (bps.cnt === 1 ? bps.val : (bps.cnt <= 2 ? bps.val & 0xffff : dv.getUint16(bps.val, le))) : null;
    const sf = tags[339]; out.sampleFormat = sf ? (sf.cnt === 1 ? sf.val : dv.getUint16(sf.val, le)) : 1;
    out.geo = !!(tags[33550] || tags[33922] || tags[34264]) && !!tags[34735];
    out.modality = out.sampleFormat === 3 && out.bands <= 2 ? 'sar' : out.bands >= 4 ? 'multispectral' : 'optical';
    if (!out.geo) out.warn = 'No GeoTIFF georeferencing tags found. Plain TIFFs are only accepted for benchmark data.';
  } catch (e) { out.ok = true; out.note = 'Header could not be fully read; the server will check it.'; }
  return out;
}

const History = {

/* =====================================================================
   FACT LABELS, UNITS AND PROVENANCE
   ===================================================================== */
const FACT_LABEL = { water_T1_m2: 'Water area, T1', water_T2_m2: 'Water area, T2', water_loss_m2: 'Water lost', water_loss_pct: 'Water lost, share', buildings_T1: 'Buildings in zone, T1', buildings_T2: 'Buildings in zone, T2', new_buildings: 'New buildings', changed_area_m2: 'Changed area', water_sar_m2: 'Water (radar)', water_optical_m2: 'Water (optical, clear sky)', water_iou: 'Optical–radar water agreement', builtup_m2: 'Built-up area (radar)', radar_only_pct: 'Answered from radar only', ndvi_mean: 'Mean NDVI', vegetated_pct: 'Vegetated share', count: 'Objects counted' };
function factLabel(k) { return FACT_LABEL[k] || k.replace(/_m2$/, ' area').replace(/_pct$/, ' share').replace(/_/g, ' ').replace(/^./, c => c.toUpperCase()); }
function factUnit(k) { return /_m2$/.test(k) ? 'm²' : /_pct$/.test(k) ? '%' : /iou/.test(k) ? 'IoU' : /ndvi/.test(k) ? 'index' : /count|buildings/.test(k) ? 'count' : ''; }
function factValue(k, v) { if (typeof v !== 'number') return esc(v); if (/_m2$/.test(k)) return fmt(v); if (/_pct$/.test(k)) return fmt(v, 1); if (/iou|ndvi/.test(k)) return v.toFixed(2); return fmt(v); }
function factSources(k, trace) {
  if (!trace) return { steps: [], how: '' };
  const S = trace.steps, by = (tool, pred) => S.filter(s => s.tool === tool && (!pred || pred(s, trace.plan.find(p => p.step_id === s.step_id))));
  const role = r => (s, p) => p && Object.values(p.inputs || {}).includes(r);
  let steps = [], how = 'Reported directly by the tool.';
  if (/^water_T1/.test(k)) steps = by('water_mask', role('T1'));
  else if (/^water_T2/.test(k)) steps = by('water_mask', role('T2'));
  else if (/^water_loss/.test(k)) { steps = by('water_mask'); how = 'Fusion: water at T1 minus water at T2, pixel count × pixel area.'; }
  else if (k === 'buildings_T1') steps = by('detector', role('T1')).filter(s => /building/.test(s.params.prompt));
  else if (k === 'buildings_T2') steps = by('detector', role('T2')).filter(s => /building/.test(s.params.prompt));
  else if (k === 'new_buildings') { steps = by('detector').filter(s => /building/.test(s.params.prompt)); how = 'Fusion: T2 boxes whose best overlap (IoU) with any T1 box is below 0.3.'; }
  else if (/changed/.test(k)) steps = by('change_map').concat(by('change_diff'));
  else if (k === 'count') steps = by('detector');
  else if (/water_sar/.test(k)) steps = by('sar_water');
  else if (/water_optical/.test(k)) steps = by('water_mask');
  else if (/water_iou/.test(k)) { steps = by('sar_water').concat(by('water_mask')); how = 'Fusion: overlap of the two water masks on clear-sky pixels.'; }
  else if (/builtup/.test(k)) steps = by('sar_builtup');
  else if (/radar_only/.test(k)) { how = 'Ingest: cloud mask of the optical image (sensor profile).'; }
  else if (/ndvi|vegetated/.test(k)) steps = by('index_mask');
  return { steps, how };
}

function linkNumbers(answer, facts) {
  const PRI = ['new_buildings', 'count', 'water_loss_m2', 'water_loss_pct', 'changed_area_m2', 'water_sar_m2', 'builtup_m2', 'water_iou', 'radar_only_pct'];
  const nums = Object.entries(facts || {}).filter(([, v]) => typeof v === 'number').sort((a, b) => ((PRI.indexOf(a[0]) + 1) || 99) - ((PRI.indexOf(b[0]) + 1) || 99));
  return esc(answer).replace(/\d[\d,]*(\.\d+)?/g, tok => {
    const val = parseFloat(tok.replace(/,/g, ''));
    const hit = nums.find(([, v]) => Math.abs(v - val) < 1e-9 || Math.abs(Math.round(v) - val) < 1e-9 && Number.isInteger(val) && Math.abs(v - val) < 1);
    return hit ? `<button class="num" data-fact="${hit[0]}" aria-label="${tok}: show where this number came from">${tok}</button>` : tok;
  });
}

}

  const blob = data instanceof Blob ? data : new Blob([data]), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return 'Download started: ' + filename;
}
function wireExport(p, ctx) {

}
function syntheticGeoJSON(res, entry) {
  const R = Synthetic.render(entry.sceneId), feats = [], ll = (x, y) => FX.pxToLonLat(x, y).map(v => +v.toFixed(7));
  const stepFor = k => { const s = factSources(/water/.test(k) ? 'water_T1_m2' : /change/.test(k) ? 'changed_area_m2' : /builtup/.test(k) ? 'builtup_m2' : /ndvi/.test(k) ? 'ndvi_mean' : 'count', res.trace).steps[0]; return s ? s.step_id : null; };
  Object.entries(res.fusion.display_detections).forEach(([layer, dets]) => dets.forEach(d => { const [x0, y0, x1, y1] = d.bbox_px; feats.push({ type: 'Feature', properties: { layer, label: d.label, score: d.score, area_m2: (x1 - x0) * (y1 - y0) * 4, step_id: layer === 'detections' ? 's1' : 's6', synthetic: true }, geometry: { type: 'Polygon', coordinates: [[ll(x0, y0), ll(x1, y0), ll(x1, y1), ll(x0, y1), ll(x0, y0)]] } }); }));
  Object.keys(res.fusion.display_masks).forEach(layer => {   // pixel-exact polygons: row runs merged vertically
    const m = R.masks[layer]; if (!m) return; const polys = []; let open = {};
    for (let y = 0; y <= FX.H; y++) {
      const runs = {}; if (y < FX.H) { let x = 0; while (x < FX.W) { if (m[y * FX.W + x]) { const s = x; while (x < FX.W && m[y * FX.W + x]) x++; runs[s + ':' + x] = 1; } else x++; } }
      const next = {}; Object.keys(open).forEach(k => { if (runs[k]) { next[k] = open[k]; delete runs[k]; } else { const [a, b] = k.split(':').map(Number); polys.push([[ll(a, open[k]), ll(b, open[k]), ll(b, y), ll(a, y), ll(a, open[k])]]); } });
      Object.keys(runs).forEach(k => next[k] = y); open = next;
    }
    feats.push({ type: 'Feature', properties: { layer, label: layerName(layer), score: null, area_m2: FX.count(m) * 4, step_id: stepFor(layer), synthetic: true }, geometry: { type: 'MultiPolygon', coordinates: polys } });
  });
  return { type: 'FeatureCollection', name: `satquery_${res.job_id}`, crs: { type: 'name', properties: { name: 'urn:ogc:def:crs:OGC:1.3:CRS84' } }, features: feats };
}
